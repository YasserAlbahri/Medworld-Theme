<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0b2e4f">
    <title>Offline - Medworld PWA</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #061a2f;
            color: #e8f1fb;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        }
        .card {
            max-width: 420px;
            border: 1px solid #1f446b;
            border-radius: 14px;
            padding: 18px;
            text-align: center;
            background: #0d2a46;
        }
        .muted { color: #9db7d3; }
        button {
            margin-top: 12px;
            border: 0;
            border-radius: 10px;
            padding: 10px 14px;
            color: #fff;
            background: #2e90ff;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>You are offline</h2>
    <p class="muted">The PWA shell is available. Local queue will continue to work and sync once connectivity returns.</p>
    <button onclick="location.href='/pwa-demo'">Retry</button>
</div>
</body>
</html>
